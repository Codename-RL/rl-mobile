name: sapa_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  dio: ^5.9.0
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.1
  geolocator: ^14.0.2
  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^6.3.2
  google_maps_flutter: ^2.13.1
  http: ^1.6.0
  intl: ^0.20.2
  permission_handler: ^12.0.1
  wechat_assets_picker: ^9.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
    - assets/icon/nav/
    - assets/icon/emotion/
    - assets/image/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png

  android_12:
    image: assets/icon/app_icon.png